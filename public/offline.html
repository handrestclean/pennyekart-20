<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8f8f5" />
    <title>Pennyekart</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        background: #f8f8f5;
        color: #20231f;
      }
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(100%, 380px);
        text-align: center;
      }
      .mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 22px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: #e8f2e9;
        color: #356a42;
      }
      .mark svg { width: 30px; height: 30px; }
      .brand { margin: 0 0 32px; font-size: 19px; font-weight: 700; }
      h1 { margin: 0 0 10px; font-size: 25px; line-height: 1.25; }
      p { margin: 0 auto 26px; color: #626860; font-size: 16px; line-height: 1.55; }
      button {
        min-height: 48px;
        min-width: 150px;
        border: 0;
        border-radius: 6px;
        padding: 0 22px;
        background: #356a42;
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:focus-visible { outline: 3px solid #9cbca3; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 9.5a11 11 0 0 1 14 0M8 12.5a6.5 6.5 0 0 1 8 0M11 15.5a2 2 0 0 1 2 0" />
          <path d="M12 19h.01" />
        </svg>
      </div>
      <div class="brand">Pennyekart</div>
      <h1>Ready when you are</h1>
      <p>Reconnect to continue shopping. Your account and saved cart are safe.</p>
      <button id="retry" type="button">Try again</button>
    </main>
    <script>
      const openShop = () => window.location.replace("https://www.pennyekart.com/");
      document.getElementById("retry").addEventListener("click", openShop);
      window.addEventListener("online", openShop, { once: true });
    </script>
  </body>
</html>
